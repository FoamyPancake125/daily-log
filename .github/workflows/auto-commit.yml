name: Daily auto-commit

on:
  schedule:
    # 6 runs spread across the day (UTC). Times in PT are approximate.
    - cron: "17 16 * * *"   # ~8am
    - cron: "41 18 * * *"   # ~10:40am
    - cron: "9 21 * * *"    # ~1pm
    - cron: "52 23 * * *"   # ~3:50pm
    - cron: "26 2 * * *"    # ~6:30pm
    - cron: "48 5 * * *"    # ~9:50pm
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make some commits
        run: |
          EMAIL="83308960+FoamyPancake125@users.noreply.github.com"
          git config user.name  "Xiangting Ren"
          git config user.email "$EMAIL"
          export TZ=America/Los_Angeles

          # Each day gets a "busyness" level shared by all its runs:
          # 0 = quiet (~1-6 commits), 1 = normal (~1-12), 2 = busy (~6-24)
          DAY=$(date +%j)
          LEVEL=$(( (10#$DAY * 7919 + 13) % 3 ))
          case $LEVEL in
            0) N=$(( RANDOM % 2 )) ;;
            1) N=$(( RANDOM % 3 )) ;;
            2) N=$(( RANDOM % 4 + 1 )) ;;
          esac

          # Never leave a day empty: if nothing has been committed yet today (PT),
          # this run makes at least one.
          TODAY=$(git log --author="$EMAIL" --since="$(date -d 'today 00:00' -Iseconds)" --oneline | wc -l)
          if [ "$TODAY" -eq 0 ] && [ "$N" -lt 1 ]; then N=1; fi
          echo "Level $LEVEL, already today: $TODAY -> $N commits this run"

          for i in $(seq 1 $N); do
            echo "$(date '+%Y-%m-%d %H:%M:%S %Z') #$i" >> log.txt
            git add log.txt
            git commit -m "Update log $(date '+%Y-%m-%d %H:%M') ($i)"
            sleep 2
          done
          git push
